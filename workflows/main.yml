name: Build Тренажёр 7 APK

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Prepare project structure
        run: |
          mkdir -p lib tools assets/faces
          for f in main models game_screen face_provider; do
            if [ -f "$f.dart" ] && [ ! -f "lib/$f.dart" ]; then cp "$f.dart" "lib/$f.dart"; fi
          done
          touch assets/faces/.gitkeep
          flutter create --project-name trenazher_7 --org com.example --platforms=android .
          sed -i 's/android:label="[^"]*"/android:label="Тренажёр 7"/' android/app/src/main/AndroidManifest.xml
          rm -rf test
          sed -i 's|<manifest xmlns:android="http://schemas.android.com/apk/res/android">|&\n    <uses-permission android:name="android.permission.INTERNET"/>|' android/app/src/main/AndroidManifest.xml
          grep -n "INTERNET" android/app/src/main/AndroidManifest.xml

      - name: Bundle offline portraits into the app
        run: bash tools/download_faces.sh 60

      - run: flutter pub get

      - name: Generate app launcher icon
        run: dart run flutter_launcher_icons

      - run: flutter build apk --release

      - uses: actions/upload-artifact@v4
        with:
          name: trenazher-7-apk
          path: build/app/outputs/flutter-apk/app-release.apk
